apiVersion: 1

prune: true

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      timeInterval: 10s

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      # Spring Boot prefixes every log line with [<app>,<traceId>,<spanId>] once
      # a tracer is on the classpath, so the trace id can be lifted straight out
      # of the log text and turned into a link into Zipkin. The doubled $$ is
      # Grafana provisioning escaping — a single $ would be read as an env var
      # and interpolated away before Grafana ever sees the field.
      derivedFields:
        - name: TraceID
          matcherRegex: '\[[^,\]]*,([0-9a-f]{32}),[0-9a-f]{16}\]'
          url: '$${__value.raw}'
          datasourceUid: zipkin

  - name: Zipkin
    uid: zipkin
    type: zipkin
    access: proxy
    url: http://zipkin:9411
    editable: false
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: -1m
        spanEndTimeShift: 1m
        filterByTraceID: true
      tracesToMetrics:
        datasourceUid: prometheus
        spanStartTimeShift: -1m
        spanEndTimeShift: 1m
