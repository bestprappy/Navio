    post:
      tags:
      - AI Planning Service
      summary: Chat with plan
      description: Conversational plan assistance using a bounded, allow-listed tool loop. Supports JSON for non-streaming clients and text/event-stream for the frontend. Returned actions are proposals only.
      operationId: postAiPlanChat
      responses:
        '200':
          description: Success
          content:
            application/json:
