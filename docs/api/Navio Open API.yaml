openapi: 3.1.0
info:
  title: Navio API
  version: 1.3.0
  description: 'Build-ready OpenAPI specification for Navio user management, trip planning, mobility and EV intelligence,
    community, and optional AI planning. Production NGINX forwards to Spring Cloud Gateway; development uses the same
    gateway directly. The gateway resolves services through Eureka and receives non-secret configuration from Config Server.
    Keycloak supplies authentication. AI Planning uses Spring AI with either local
    Ollama on the ML VM or a hosted model provider without changing the public API.
    All endpoints are versioned under /v1.


    Version 1.3 retains the domain API while making Spring Cloud Gateway, Eureka, Config Server, and centralized observability
    mandatory platform concerns. It assigns user/profile/role endpoints to User Management, media and notifications to
    Community, geo/routing to Mobility & EV, and documents provider-neutral AI Planning.'
servers:
- url: https://api.navio.local
  description: Production NGINX edge forwarding to Spring Cloud Gateway
- url: http://localhost:8080
  description: Spring Cloud Gateway development entry point
- url: http://localhost:8081
  description: User Management direct private/debug access only
- url: http://localhost:8082
  description: Trip Planning direct private/debug access only
- url: http://localhost:8083
  description: Mobility & EV direct private/debug access only
- url: http://localhost:8084
  description: Community direct private/debug access only
- url: http://localhost:8085
  description: AI Planning direct private/debug access only; deployed on the ML VM with Ollama or on the application VM with a hosted provider
security:
- bearerAuth: []
tags:
- name: User Management Service
- name: Trip Planning Service
- name: Mobility & EV Service
- name: Community Service
- name: AI Planning Service
- name: Trip Planning Details
- name: Geo Provider
- name: Budgeting
paths:
  /v1/trips:
    post:
      tags:
      - Trip Planning Service
      summary: Create trip
      description: Creates a new private trip owned by the authenticated user.
      operationId: postTrips
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
              examples:
                default:
                  value:
                    id: trip_01HX
                    ownerUserId: user_123
                    title: Bangkok to Hua Hin EV Weekend
                    visibility: private
                    stops:
                    - name: Bangkok
                      location:
                        lat: 13.7563
                        lng: 100.5018
                        address: Bangkok
                      orderIndex: 0
                    - name: Hua Hin
                      location:
                        lat: 12.5684
                        lng: 99.9577
                        address: Hua Hin
                      orderIndex: 1
                    routeLegs: []
                    evProfile:
                      vehicleName: BYD Atto 3
                      batteryCapacityKwh: 60.5
                      currentBatteryPercent: 80
                      minArrivalBatteryPercent: 15
                      consumptionKwhPer100Km: 16.5
                      connectorTypes:
                      - CCS2
                    sourceMetadata: {}
                    createdAt: '2026-05-07T05:00:00Z'
                    updatedAt: '2026-05-07T05:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TripRequest'
            examples:
              default:
                value:
                  title: Bangkok to Hua Hin EV Weekend
                  description: 2-day EV-friendly road trip
                  startDate: '2026-06-01'
                  endDate: '2026-06-02'
                  stops:
                  - name: Bangkok
                    location:
                      lat: 13.7563
                      lng: 100.5018
                      address: Bangkok
                    orderIndex: 0
                  - name: Hua Hin
                    location:
                      lat: 12.5684
                      lng: 99.9577
                      address: Hua Hin
                    orderIndex: 1
                  evProfile:
                    vehicleName: BYD Atto 3
                    batteryCapacityKwh: 60.5
                    currentBatteryPercent: 80
                    minArrivalBatteryPercent: 15
                    consumptionKwhPer100Km: 16.5
                    connectorTypes:
                    - CCS2
  /v1/public-trips:
    get:
      tags:
      - Trip Planning Service
      summary: Search public trip templates
      description: Returns public trips for the Explore catalogue. Trip Planning owns the index and enforces visibility.
      operationId: searchPublicTrips
      parameters:
      - name: q
        in: query
        schema:
          type: string
      - name: destination
        in: query
        schema:
          type: string
      - name: tags
        in: query
        schema:
          type: array
          items:
            type: string
      - name: sort
        in: query
        schema:
          type: string
          enum:
          - recent
          - trending
          - popular
      - name: page
        in: query
        schema:
          type: integer
          minimum: 0
      - name: size
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
      responses:
        '200':
          description: Public trip page
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Trip'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
        '400':
          $ref: '#/components/responses/BadRequest'
  /v1/public-trips/{tripId}:
    get:
      tags:
      - Trip Planning Service
      summary: Get public trip template
      operationId: getPublicTrip
      parameters:
      - name: tripId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Public trip
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/trips/{tripId}:
    get:
      tags:
      - Trip Planning Service
      summary: Get trip
      description: Returns one trip if the user has access or the trip is public.
      operationId: getTripsTripId
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
              examples:
                default:
                  value:
                    id: trip_01HX
                    ownerUserId: user_123
                    title: Bangkok to Hua Hin EV Weekend
                    visibility: private
                    stops:
                    - name: Bangkok
                      location:
                        lat: 13.7563
                        lng: 100.5018
                        address: Bangkok
                      orderIndex: 0
                    - name: Hua Hin
                      location:
                        lat: 12.5684
                        lng: 99.9577
                        address: Hua Hin
                      orderIndex: 1
                    routeLegs: []
                    evProfile:
                      vehicleName: BYD Atto 3
                      batteryCapacityKwh: 60.5
                      currentBatteryPercent: 80
                      minArrivalBatteryPercent: 15
                      consumptionKwhPer100Km: 16.5
                      connectorTypes:
                      - CCS2
                    sourceMetadata: {}
                    createdAt: '2026-05-07T05:00:00Z'
                    updatedAt: '2026-05-07T05:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
      - name: tripId
        in: path
        required: true
        schema:
          type: string
        description: tripId path parameter
    patch:
      tags:
      - Trip Planning Service
      summary: Update trip
      description: Updates title, dates, stops, route legs, EV profile, or notes and writes a revision.
      operationId: patchTripsTripId
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
              examples:
                default:
                  value:
                    id: trip_01HX
                    ownerUserId: user_123
                    title: Bangkok to Hua Hin EV Weekend
                    visibility: private
                    stops:
                    - name: Bangkok
                      location:
                        lat: 13.7563
                        lng: 100.5018
                        address: Bangkok
                      orderIndex: 0
                    - name: Hua Hin
                      location:
                        lat: 12.5684
                        lng: 99.9577
                        address: Hua Hin
                      orderIndex: 1
                    routeLegs: []
                    evProfile:
                      vehicleName: BYD Atto 3
                      batteryCapacityKwh: 60.5
                      currentBatteryPercent: 80
                      minArrivalBatteryPercent: 15
                      consumptionKwhPer100Km: 16.5
                      connectorTypes:
                      - CCS2
                    sourceMetadata: {}
                    createdAt: '2026-05-07T05:00:00Z'
                    updatedAt: '2026-05-07T05:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
      - name: tripId
        in: path
        required: true
        schema:
          type: string
        description: tripId path parameter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TripRequest'
            examples:
              default:
                value:
                  title: Bangkok to Hua Hin EV Weekend
                  description: 2-day EV-friendly road trip
                  startDate: '2026-06-01'
                  endDate: '2026-06-02'
                  stops:
                  - name: Bangkok
                    location:
                      lat: 13.7563
                      lng: 100.5018
                      address: Bangkok
                    orderIndex: 0
                  - name: Hua Hin
                    location:
                      lat: 12.5684
                      lng: 99.9577
                      address: Hua Hin
                    orderIndex: 1
                  evProfile:
                    vehicleName: BYD Atto 3
                    batteryCapacityKwh: 60.5
                    currentBatteryPercent: 80
                    minArrivalBatteryPercent: 15
                    consumptionKwhPer100Km: 16.5
                    connectorTypes:
                    - CCS2
    delete:
      tags:
      - Trip Planning Service
      summary: Delete trip
      description: Soft-deletes or deletes a trip owned by the current user.
      operationId: deleteTripsTripId
      responses:
        '204':
          description: Success - no response body
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
      - name: tripId
        in: path
        required: true
        schema:
          type: string
        description: tripId path parameter
  /v1/trips/{tripId}/revisions:
    get:
      tags:
      - Trip Planning Service
      summary: List trip revisions
      description: Lists revision history for rollback and audit display.
      operationId: getTripsTripIdRevisions
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevisionList'
              examples:
                default:
                  value:
                    items:
                    - id: rev_01HX
                      tripId: trip_01HX
                      revisionNumber: 1
                      message: Initial version
                      createdAt: '2026-05-07T05:00:00Z'
                    meta:
                      page: 0
                      size: 20
                      totalItems: 1
                      totalPages: 1
                      hasNext: false
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
      - name: tripId
        in: path
        required: true
        schema:
          type: string
        description: tripId path parameter
      - name: page
        in: query
        required: false
        schema:
          type: integer
        examples:
          default:
            value: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
        examples:
          default:
            value: 20
  /v1/trips/{tripId}/rollback:
    post:
      tags:
      - Trip Planning Service
      summary: Rollback trip
      description: Restores a trip snapshot from a specific revision and creates a new revision.
      operationId: postTripsTripIdRollback
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
              examples:
                default:
                  value:
                    id: trip_01HX
                    ownerUserId: user_123
                    title: Bangkok to Hua Hin EV Weekend
                    visibility: private
                    stops:
                    - name: Bangkok
                      location:
                        lat: 13.7563
                        lng: 100.5018
                        address: Bangkok
                      orderIndex: 0
                    - name: Hua Hin
                      location:
                        lat: 12.5684
                        lng: 99.9577
                        address: Hua Hin
                      orderIndex: 1
                    routeLegs: []
                    evProfile:
                      vehicleName: BYD Atto 3
                      batteryCapacityKwh: 60.5
                      currentBatteryPercent: 80
                      minArrivalBatteryPercent: 15
                      consumptionKwhPer100Km: 16.5
                      connectorTypes:
                      - CCS2
                    sourceMetadata: {}
                    createdAt: '2026-05-07T05:00:00Z'
                    updatedAt: '2026-05-07T05:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
      - name: tripId
        in: path
        required: true
        schema:
          type: string
        description: tripId path parameter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RollbackRequest'
            examples:
              default:
                value:
                  revisionId: rev_01HX
  /v1/trips/{tripId}/visibility:
    post:
      tags:
      - Trip Planning Service
      summary: Change visibility
      description: Changes visibility between private, unlisted, and public.
      operationId: postTripsTripIdVisibility
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
              examples:
                default:
                  value:
                    id: trip_01HX
                    ownerUserId: user_123
                    title: Bangkok to Hua Hin EV Weekend
                    visibility: private
                    stops:
                    - name: Bangkok
                      location:
                        lat: 13.7563
                        lng: 100.5018
                        address: Bangkok
                      orderIndex: 0
                    - name: Hua Hin
                      location:
                        lat: 12.5684
                        lng: 99.9577
                        address: Hua Hin
                      orderIndex: 1
                    routeLegs: []
                    evProfile:
                      vehicleName: BYD Atto 3
                      batteryCapacityKwh: 60.5
                      currentBatteryPercent: 80
                      minArrivalBatteryPercent: 15
                      consumptionKwhPer100Km: 16.5
                      connectorTypes:
                      - CCS2
                    sourceMetadata: {}
                    createdAt: '2026-05-07T05:00:00Z'
                    updatedAt: '2026-05-07T05:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
      - name: tripId
        in: path
        required: true
        schema:
          type: string
        description: tripId path parameter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VisibilityRequest'
            examples:
              default:
                value:
                  visibility: public
                  reason: Ready to share
  /v1/trips/{tripId}/copy:
    post:
      tags:
      - Trip Planning Service
      summary: Copy trip
      description: 'Copies a public/community/shared trip into the current user''s private trip library as an independent
        snapshot.


        Notes: Copied trip starts private. Source deletion or edits do not affect the copy.'
      operationId: postTripsTripIdCopy
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
              examples:
                default:
                  value:
                    id: trip_01HX
                    ownerUserId: user_123
                    title: Bangkok to Hua Hin EV Weekend
                    visibility: private
                    stops:
                    - name: Bangkok
                      location:
                        lat: 13.7563
                        lng: 100.5018
                        address: Bangkok
                      orderIndex: 0
                    - name: Hua Hin
                      location:
                        lat: 12.5684
                        lng: 99.9577
                        address: Hua Hin
                      orderIndex: 1
                    routeLegs: []
                    evProfile:
                      vehicleName: BYD Atto 3
                      batteryCapacityKwh: 60.5
                      currentBatteryPercent: 80
                      minArrivalBatteryPercent: 15
                      consumptionKwhPer100Km: 16.5
                      connectorTypes:
                      - CCS2
                    sourceMetadata: {}
                    createdAt: '2026-05-07T05:00:00Z'
                    updatedAt: '2026-05-07T05:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
      - name: tripId
        in: path
        required: true
        schema:
          type: string
        description: tripId path parameter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CopyTripRequest'
            examples:
              default:
                value:
                  sourcePostId: post_01HX
                  newTitle: My Copy of Hua Hin Trip
  /v1/trips/{tripId}/share-links:
    post:
      tags:
      - Trip Planning Service
      summary: Create share link
      description: Creates an unlisted share token, optionally expiring and allowing copy.
      operationId: postTripsTripIdShareLinks
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShareLink'
              examples:
                default:
                  value:
                    id: token_01HX
                    tripId: trip_01HX
                    token: shr_abc
                    url: https://api.navio.local/v1/share/shr_abc
                    allowCopy: true
                    expiresAt: '2026-07-01T00:00:00Z'
                    createdAt: '2026-05-07T05:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
      - name: tripId
        in: path
        required: true
        schema:
          type: string
        description: tripId path parameter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShareLinkRequest'
            examples:
              default:
                value:
                  expiresAt: '2026-07-01T00:00:00Z'
                  allowCopy: true
  /v1/trips/{tripId}/share-links/{tokenId}:
    delete:
      tags:
      - Trip Planning Service
      summary: Revoke share link
      description: Revokes an existing share token.
      operationId: deleteTripsTripIdShareLinksTokenId
      responses:
        '204':
          description: Success - no response body
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
      - name: tripId
        in: path
        required: true
        schema:
          type: string
        description: tripId path parameter
      - name: tokenId
        in: path
        required: true
        schema:
          type: string
        description: tokenId path parameter
  /v1/share/{token}:
    get:
      tags:
      - Trip Planning Service
      summary: Resolve share link
      description: Public endpoint that returns a shareable trip view from a token.
      operationId: getShareToken
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShareResolve'
              examples:
                default:
                  value:
                    trip:
                      id: trip_01HX
                      title: Bangkok to Hua Hin EV Weekend
                      visibility: unlisted
                      stops: []
                    canCopy: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
        description: token path parameter
      security: []
  /v1/trips/{tripId}/permissions:
    post:
      tags:
      - Trip Planning Service
      summary: Update trip permissions
      description: Adds or removes authoritative viewer/editor permissions owned by Trip Planning.
      operationId: postTripsTripIdPermissions
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionsResponse'
              examples:
                default:
                  value:
                    items:
                    - userId: user_456
                      role: viewer
                      displayName: Nok
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
      - name: tripId
        in: path
        required: true
        schema:
          type: string
        description: tripId path parameter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PermissionsRequest'
            examples:
              default:
                value:
                  add:
                  - userId: user_456
                    role: viewer
                  removeUserIds: []
    get:
      tags:
      - Trip Planning Service
      summary: Get trip permissions
      description: Returns current trip-scoped permission entries.
      operationId: getTripsTripIdPermissions
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionsResponse'
              examples:
                default:
                  value:
                    items:
                    - userId: user_456
                      role: viewer
                      displayName: Nok
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
      - name: tripId
        in: path
        required: true
        schema:
          type: string
        description: tripId path parameter
  /v1/users/me:
    get:
      tags:
      - User Management Service
      summary: Get current user
      description: Returns the authenticated user's mirrored app profile and preferences.
      operationId: getMe
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
              examples:
                default:
                  value:
                    id: user_123
                    displayName: Somchai
                    email: somchai@example.com
                    roles:
                    - USER
                    preferences:
                      language: en
                      distanceUnit: km
                      notificationEmail: true
                      notificationPush: false
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/users/me/preferences:
    patch:
      tags:
      - User Management Service
      summary: Update preferences
      description: Updates current user's language, distance, and notification preferences.
      operationId: patchMePreferences
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
              examples:
                default:
                  value:
                    id: user_123
                    displayName: Somchai
                    email: somchai@example.com
                    roles:
                    - USER
                    preferences:
                      language: en
                      distanceUnit: km
                      notificationEmail: true
                      notificationPush: false
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserPreferences'
            examples:
              default:
                value:
                  language: en
                  distanceUnit: km
                  notificationEmail: true
                  notificationPush: false
  /v1/users/me/vehicles:
    get:
      tags:
      - User Management Service
      summary: List saved vehicles
      operationId: listCurrentUserVehicles
      responses:
        '200':
          description: Saved vehicles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserVehicle'
        '401':
