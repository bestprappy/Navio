  /v1/ai/plan/suggest:
    post:
      tags:
      - AI Planning Service
      summary: Suggest plan changes
      description: Uses the configured Spring AI provider to produce schema-validated itinerary and EV improvement proposals. The endpoint never applies changes directly; the user must confirm a proposal through Trip Planning.
      operationId: postAiPlanSuggest
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiPlanSuggestResponse'
              examples:
                default:
                  value:
                    sessionId: ai_sess_01HX
                    summary: Add one charging stop before Hua Hin.
                    actions:
                    - type: recompute_ev_route
                      description: Recompute with fresh charger data.
                      payload: {}
                    quota:
                      tokensUsedThisMonth: 12500
                      monthlyTokenLimit: 100000
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiPlanSuggestRequest'
            examples:
              default:
                value:
                  tripId: trip_01HX
                  goal: Make this trip safer for an EV with fewer low-battery segments.
                  constraints:
                  - Prefer CCS2 chargers above 50 kW
