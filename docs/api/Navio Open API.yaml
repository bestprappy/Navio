components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Keycloak/OIDC JWT access token
    internalAuth:
      type: apiKey
      in: header
      name: X-Internal-Auth
      description: Shared secret for service-to-service calls on localhost
  schemas:
    ErrorResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
          examples:
            - '2026-05-07T05:00:00Z'
        status:
          type: integer
          examples:
            - 400
        code:
          type: string
          examples:
            - VALIDATION_ERROR
        message:
          type: string
          examples:
            - Invalid request
        path:
          type: string
          examples:
            - /v1/trips
        requestId:
          type: string
          examples:
            - req_01HX...
      required:
      - timestamp
      - status
      - code
      - message
      - path
    PageMeta:
      type: object
      properties:
        page:
          type: integer
          examples:
            - 0
        size:
          type: integer
          examples:
            - 20
        totalItems:
          type: integer
          examples:
            - 42
        totalPages:
          type: integer
          examples:
            - 3
        hasNext:
          type: boolean
          examples:
            - true
    Location:
      type: object
      properties:
        lat:
          type: number
          format: double
          examples:
            - 13.7563
        lng:
          type: number
          format: double
          examples:
            - 100.5018
        address:
          type: [string, "null"]
          examples:
            - Bangkok, Thailand
        placeId:
          type: [string, "null"]
          examples:
            - ChIJ...
      required:
      - lat
      - lng
    TripStop:
      type: object
      properties:
        id:
          type: string
          examples:
            - stop_01HX
        name:
          type: string
          examples:
            - Bangkok
        location:
          $ref: '#/components/schemas/Location'
        arrivalAt:
          type: [string, "null"]
          format: date-time
        departureAt:
          type: [string, "null"]
          format: date-time
        notes:
          type: [string, "null"]
        orderIndex:
          type: integer
          examples:
            - 0
      required:
      - name
      - location
      - orderIndex
    EvProfile:
      type: object
      properties:
        vehicleName:
          type: string
          examples:
            - BYD Atto 3
        batteryCapacityKwh:
          type: number
          examples:
            - 60.5
        currentBatteryPercent:
          type: number
          examples:
            - 80
        minArrivalBatteryPercent:
          type: number
          examples:
            - 15
        consumptionKwhPer100Km:
          type: number
          examples:
            - 16.5
        connectorTypes:
          type: array
          items:
            type: string
            enum:
            - CCS2
            - CHADEMO
            - TYPE2
            - NACS
            - GB_T
            examples:
              - CCS2
    RouteLeg:
      type: object
      properties:
        fromStopId:
          type: string
        toStopId:
          type: string
        distanceKm:
          type: number
          examples:
            - 125.4
        durationMinutes:
          type: integer
          examples:
            - 130
        polyline:
          type: [string, "null"]
        requiresCharging:
          type: boolean
          examples:
            - false
        recommendedChargerIds:
          type: array
          items:
            type: string
    TripRequest:
      type: object
      properties:
        title:
          type: string
          examples:
            - Bangkok to Hua Hin EV Weekend
        description:
