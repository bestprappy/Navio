name: Deploy backend

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: navio-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE_PREFIX: ghcr.io/bestprappy/navio

jobs:
  verify-backend-revisions:
    name: Verify backend revisions are current
    runs-on: ubuntu-latest

    steps:
      - name: Check out deployment repository
        uses: actions/checkout@v7

      - name: Check out submodules
        shell: bash
        run: |
          git submodule sync -- client server
          git submodule update --init --depth 1 client server
          git -C server submodule sync --recursive
          git -C server submodule update --init --recursive --depth 1

      - name: Compare pinned revisions with backend main branches
        shell: bash
        run: |
          repositories=(
            client
            server
            server/user-management-service
            server/trip-planning-service
            server/mobility-and-ev-service
            server/community-service
          )

          for repository in "${repositories[@]}"; do
            pinned_revision="$(git -C "${repository}" rev-parse HEAD)"
            latest_revision="$(git -C "${repository}" ls-remote origin refs/heads/main | awk '{print $1}')"

            if [[ -z "${latest_revision}" ]]; then
              echo "Unable to resolve ${repository} origin/main." >&2
              exit 1
            fi

            if [[ "${pinned_revision}" != "${latest_revision}" ]]; then
              echo "${repository} is stale: pinned=${pinned_revision}, main=${latest_revision}" >&2
              exit 1
            fi

            echo "${repository} is current at ${pinned_revision}."
          done

  verify-database-schema:
    name: Verify migrations and entity mappings on PostgreSQL
    needs: verify-backend-revisions
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Production runs Flyway and then Hibernate ddl-auto=validate on startup, so a
    # mapping mismatch crash-loops a service after every image is already built.
    # Each service's PostgresSchemaTests reproduces that startup against a real
    # PostGIS database. See docs/agents/database-changes.md.
    services:
      postgres:
        image: postgis/postgis:16-3.5-alpine
        env:
          POSTGRES_DB: tripplanner
          POSTGRES_USER: tripplanner
          POSTGRES_PASSWORD: tripplanner
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tripplanner -d tripplanner"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      NAVIO_TEST_DB_URL: jdbc:postgresql://localhost:5432/tripplanner
      NAVIO_TEST_DB_USERNAME: tripplanner
      NAVIO_TEST_DB_PASSWORD: tripplanner

    steps:
      - name: Check out deployment repository
        uses: actions/checkout@v7

      - name: Check out submodules
        shell: bash
        run: |
          git submodule sync -- server
          git submodule update --init --depth 1 server
          git -C server submodule sync --recursive
          git -C server submodule update --init --recursive --depth 1

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: server/**/pom.xml

      # trip-planning-service and user-management-service import the
      # configuration server at startup, even in a JPA slice.
      - name: Start configuration server
        shell: bash
        run: |
          cd server/configuration-server
          chmod +x mvnw
          nohup ./mvnw -B -ntp spring-boot:run > "${RUNNER_TEMP}/configuration-server.log" 2>&1 &
          for attempt in $(seq 1 90); do
            if curl -fs http://localhost:8888/trip-planning-service/default > /dev/null; then
              echo "Configuration server is up."
              exit 0
            fi
            sleep 2
          done
          echo "Configuration server did not start." >&2
          tail -n 100 "${RUNNER_TEMP}/configuration-server.log" >&2
          exit 1

      - name: Run PostgreSQL schema tests
        shell: bash
        run: |
          for service in user-management-service trip-planning-service mobility-and-ev-service community-service; do
            echo "::group::${service}"
            (cd "server/${service}" && chmod +x mvnw && ./mvnw -B -ntp test -Dtest=PostgresSchemaTests)
            echo "::endgroup::"
          done

      - name: Show configuration server log
        if: failure()
        shell: bash
        run: tail -n 200 "${RUNNER_TEMP}/configuration-server.log" || true

  build:
    name: Build ${{ matrix.image }}
    needs:
      - verify-backend-revisions
      - verify-database-schema
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - image: configuration-server
            service_path: server/configuration-server
          - image: discovery-server
            service_path: server/discovery-server
          - image: api-gateway
            service_path: server/api-gateway
          - image: user-management-service
            service_path: server/user-management-service
          - image: trip-planning-service
            service_path: server/trip-planning-service
          - image: mobility-and-ev-service
            service_path: server/mobility-and-ev-service
          - image: community-service
            service_path: server/community-service
          - image: web-client
            service_path: client
            dockerfile: .deploy/docker/web-client.Dockerfile
          - image: community-storage
            dockerfile: .deploy/docker/community-storage.Dockerfile

    steps:
      - name: Check out deployment repository
        uses: actions/checkout@v7

      - name: Check out submodules
        shell: bash
        run: |
          git submodule sync -- client server
          git submodule update --init --depth 1 client server
          git -C server submodule sync --recursive
          git -C server submodule update --init --recursive --depth 1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile || '.deploy/docker/java-service.Dockerfile' }}
          # SERVICE_PATH is consumed by the Java image only. The web client
          # ignores it and instead needs its NEXT_PUBLIC_* values at BUILD time,
          # because next build inlines them into the browser bundle — they
          # cannot be supplied as runtime environment. Only public,
          # referrer-restricted keys may be passed here; they end up readable
          # inside the published image.
          build-args: |
            SERVICE_PATH=${{ matrix.service_path }}
            NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
            NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID=${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.image }}:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  deploy:
    name: Deploy to Navio VM
    needs: build
    if: github.repository == 'bestprappy/Navio'
    runs-on: [self-hosted, Linux, X64, navio-production]
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read

    steps:
      - name: Check out deployment files
        uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy release
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          chmod +x .deploy/scripts/deploy.sh
          .deploy/scripts/deploy.sh

