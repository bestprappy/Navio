global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'navio'
    environment: 'development'

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          cluster: 'navio'
          environment: 'development'
          service: 'prometheus'

  - job_name: 'loki'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['loki:3100']
        labels:
          cluster: 'navio'
          environment: 'development'
          service: 'loki'

  - job_name: 'zipkin'
    metrics_path: '/prometheus'
    static_configs:
      - targets: ['zipkin:9411']
        labels:
          cluster: 'navio'
          environment: 'development'
          service: 'zipkin'

  - job_name: 'alloy'
    static_configs:
      - targets: ['alloy:12345']
        labels:
          cluster: 'navio'
          environment: 'development'
          service: 'alloy'

  - job_name: 'api-gateway'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 10s
    static_configs:
      - targets: ['host.docker.internal:8080']
        labels:
          cluster: 'navio'
          environment: 'development'
          service: 'api-gateway'

  - job_name: 'config-server'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 10s
    static_configs:
      - targets: ['host.docker.internal:8888']
        labels:
          cluster: 'navio'
          environment: 'development'
          service: 'config-server'

  - job_name: 'discovery-server'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 10s
    static_configs:
      - targets: ['host.docker.internal:8761']
        labels:
          cluster: 'navio'
          environment: 'development'
          service: 'discovery-server'

  - job_name: 'trip-planning-service'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 10s
    static_configs:
      - targets: ['host.docker.internal:8082']
        labels:
          cluster: 'navio'
          environment: 'development'
          service: 'trip-planning-service'

  - job_name: 'user-management-service'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 10s
    static_configs:
      - targets: ['host.docker.internal:8081']
        labels:
          cluster: 'navio'
          environment: 'development'
          service: 'user-management-service'

  - job_name: 'mobility-and-ev-service'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 10s
    static_configs:
      - targets: ['host.docker.internal:8083']
        labels:
          cluster: 'navio'
          environment: 'development'
          service: 'mobility-and-ev-service'

  - job_name: 'community-service'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 10s
    static_configs:
      - targets: ['host.docker.internal:8084']
        labels:
          cluster: 'navio'
          environment: 'development'
          service: 'community-service'
