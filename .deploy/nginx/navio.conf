limit_req_zone $binary_remote_addr zone=navio_api:10m rate=30r/s;

upstream navio_gateway {
    server api-gateway:8080;
    keepalive 32;
}

upstream navio_keycloak {
    server keycloak:8080;
    keepalive 16;
}

server {
    listen 80 default_server;
    server_name navio.sit.kmutt.ac.th;

    server_tokens off;
    client_max_body_size 12m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    location = / {
        default_type application/json;
        return 200 '{"service":"navio-api","status":"running"}\n';
    }

    location = /health {
        access_log off;
        proxy_pass http://navio_gateway/actuator/health;
    }

    location /v1/ {
        limit_req zone=navio_api burst=60 nodelay;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_pass http://navio_gateway;
    }

    location ~ ^/(realms|resources|admin|js|\.well-known)/ {
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_pass http://navio_keycloak;
    }

    location / {
        default_type application/json;
        return 404 '{"error":"not_found"}\n';
    }
}

