limit_req_zone $binary_remote_addr zone=navio_api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=navio_grafana:10m rate=20r/s;

map $http_upgrade $navio_connection_upgrade {
    default upgrade;
    ''      close;
}

upstream navio_gateway {
    server api-gateway:8080;
    keepalive 32;
}

upstream navio_keycloak {
    server keycloak:8080;
    keepalive 16;
}

upstream navio_grafana {
    server grafana:3000;
    keepalive 8;
}

upstream navio_web {
    server navio-web:3000;
    keepalive 16;
}

server {
    listen 80 default_server;
    server_name navio.sit.kmutt.ac.th;

    # ACME HTTP-01 challenge must stay on plaintext port 80. Certbot writes the
    # token here and Let's Encrypt reads it back before issuing or renewing.
    # ^~ stops the redirect below from capturing it.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    # The redirect lives in a location rather than at server level on purpose: a
    # server-level `return` runs for every request and would swallow the ACME
    # challenge above, breaking renewal with no visible error until the
    # certificate expires.
    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name navio.sit.kmutt.ac.th;

    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;
    client_max_body_size 12m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    # Auth.js splits its session JWT across several Set-Cookie headers on the
    # OIDC callback, and Keycloak's own auth cookies are large as well. nginx's
    # default 4k proxy buffer cannot hold that response header block, so the
    # callback dies with 502 and "upstream sent too big header" — after the user
    # has already signed in successfully. The body is unaffected; this only
    # needs to be large enough for headers.
    proxy_buffer_size 16k;
    proxy_buffers 8 16k;
    proxy_busy_buffers_size 32k;

    location = /health {
        access_log off;
        proxy_pass http://navio_gateway/actuator/health;
    }

    location /v1/ {
        limit_req zone=navio_api burst=60 nodelay;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_pass http://navio_gateway;
    }

    # Grafana is the only observability component reachable from outside the
    # VM. Prometheus, Loki, and Alloy stay on the internal backend network.
    # ^~ so this prefix wins over the Keycloak regex location below.
    location ^~ /grafana/ {
        limit_req zone=navio_grafana burst=100 nodelay;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $navio_connection_upgrade;
        proxy_buffering off;
        proxy_pass http://navio_grafana;
    }

    location = /grafana {
        return 301 /grafana/;
    }

    location ~ ^/(realms|resources|admin|js|\.well-known)/ {
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_pass http://navio_keycloak;
    }

    # The Next.js client owns everything not claimed above, including its own
    # /api/** backend-for-frontend routes and /_next/** build assets. It is the
    # last location on purpose: /v1/, /grafana/, and the Keycloak paths must
    # win over it.
    location / {
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $navio_connection_upgrade;
        proxy_pass http://navio_web;
    }
}

