global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'navio'
    environment: 'production'

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          cluster: 'navio'
          environment: 'production'
          service: 'prometheus'

  - job_name: 'loki'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['loki:3100']
        labels:
          cluster: 'navio'
          environment: 'production'
          service: 'loki'

  - job_name: 'alloy'
    static_configs:
      - targets: ['alloy:12345']
        labels:
          cluster: 'navio'
          environment: 'production'
          service: 'alloy'

  - job_name: 'api-gateway'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 15s
    static_configs:
      - targets: ['api-gateway:8080']
        labels:
          cluster: 'navio'
          environment: 'production'
          service: 'api-gateway'

  - job_name: 'config-server'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 15s
    static_configs:
      - targets: ['config-server:8888']
        labels:
          cluster: 'navio'
          environment: 'production'
          service: 'config-server'

  - job_name: 'discovery-server'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 15s
    static_configs:
      - targets: ['discovery-server:8761']
        labels:
          cluster: 'navio'
          environment: 'production'
          service: 'discovery-server'

  - job_name: 'user-management-service'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 15s
    static_configs:
      - targets: ['user-management-service:8081']
        labels:
          cluster: 'navio'
          environment: 'production'
          service: 'user-management-service'

  - job_name: 'trip-planning-service'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 15s
    static_configs:
      - targets: ['trip-planning-service:8082']
        labels:
          cluster: 'navio'
          environment: 'production'
          service: 'trip-planning-service'

  - job_name: 'mobility-and-ev-service'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 15s
    static_configs:
      - targets: ['mobility-and-ev-service:8083']
        labels:
          cluster: 'navio'
          environment: 'production'
          service: 'mobility-and-ev-service'

  - job_name: 'community-service'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 15s
    static_configs:
      - targets: ['community-service:8084']
        labels:
          cluster: 'navio'
          environment: 'production'
          service: 'community-service'
