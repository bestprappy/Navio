spring:
  datasource:
    url: ${COMMUNITY_DB_URL:jdbc:postgresql://postgres:5432/tripplanner}
    username: ${COMMUNITY_DB_USERNAME:tripplanner}
    password: ${COMMUNITY_DB_PASSWORD}
  jpa:
    database: POSTGRESQL
    open-in-view: false
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        default_schema: social
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas:
      - social
      - notif
      - media
    default-schema: social
    create-schemas: true
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=10000,expireAfterWrite=10m
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    consumer:
      group-id: community-service
      auto-offset-reset: earliest
    producer:
      acks: all
  cloud:
    bus:
      destination: navio-config-bus
    stream:
      kafka:
        binder:
          brokers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://discovery-server:8761/eureka}
    register-with-eureka: true
    fetch-registry: true
    healthcheck:
      enabled: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  prometheus:
    metrics:
      export:
        enabled: true

server:
  port: 8084

navio:
  notifications:
    trip-events:
      # Consumes trip.events.v1 (SharedPlanListed.v1) into follower notifications.
      enabled: ${COMMUNITY_TRIP_EVENTS_ENABLED:true}
      topic: trip.events.v1
      # Older events are recorded but not delivered, so a backlog never floods inboxes.
      max-age: P3D
    stream:
      # Live inbox hints over SSE. Disabling keeps the durable inbox and its polling.
      enabled: ${COMMUNITY_NOTIFICATION_STREAM_ENABLED:true}
      per-user: 5
      max-connections: 500
      max-lifetime: PT30M
      heartbeat-ms: 25000
    legacy-plan-announcements:
      # Browser-triggered POST /v1/notifications/plan-shared fan-out. Off while the
      # trip outbox relay is on; turn on only if TRIP_OUTBOX_RELAY_ENABLED is false.
      enabled: ${COMMUNITY_LEGACY_PLAN_ANNOUNCEMENTS:false}
  trip-planning:
    # Used only when Eureka has no trip-planning instance: post attachments check plan cards here.
    base-url: ${TRIP_PLANNING_BASE_URL:http://trip-planning-service:8082}
  community:
    media:
      endpoint: ${COMMUNITY_S3_ENDPOINT:}
      region: ${COMMUNITY_S3_REGION:us-east-1}
      bucket: ${COMMUNITY_S3_BUCKET:navio-community}
      path-style: ${COMMUNITY_S3_PATH_STYLE:false}
      public-base-url: ${COMMUNITY_PUBLIC_BASE_URL:https://navio.sit.kmutt.ac.th}

