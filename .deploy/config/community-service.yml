spring:
  datasource:
    url: ${COMMUNITY_DB_URL:jdbc:postgresql://postgres:5432/tripplanner}
    username: ${COMMUNITY_DB_USERNAME:tripplanner}
    password: ${COMMUNITY_DB_PASSWORD}
  jpa:
    database: POSTGRESQL
    open-in-view: false
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        default_schema: social
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas:
      - social
      - notif
      - media
    default-schema: social
    create-schemas: true
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=10000,expireAfterWrite=10m
  servlet:
    multipart:
      max-file-size: ${COMMUNITY_MAX_FILE_SIZE:10MB}
      max-request-size: ${COMMUNITY_MAX_REQUEST_SIZE:12MB}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    consumer:
      group-id: community-service
      auto-offset-reset: earliest
    producer:
      acks: all
  cloud:
    bus:
      destination: navio-config-bus
    stream:
      kafka:
        binder:
          brokers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://discovery-server:8761/eureka}
    register-with-eureka: true
    fetch-registry: true
    healthcheck:
      enabled: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  prometheus:
    metrics:
      export:
        enabled: true

server:
  port: 8084

navio:
  community:
    media:
      storage-path: ${COMMUNITY_MEDIA_STORAGE_PATH:/data/community-media}

