spring:
  datasource:
    url: ${MOBILITY_DB_URL:jdbc:postgresql://postgres:5432/tripplanner}
    username: ${MOBILITY_DB_USERNAME:tripplanner}
    password: ${MOBILITY_DB_PASSWORD}
  jpa:
    database: POSTGRESQL
    open-in-view: false
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.spatial.dialect.postgis.PostgisPG10Dialect
    properties:
      hibernate:
        default_schema: ev
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: ev
    default-schema: ev
    create-schemas: true
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=10000,expireAfterWrite=15m
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    consumer:
      group-id: mobility-and-ev-service
      auto-offset-reset: earliest
    producer:
      acks: all
  cloud:
    bus:
      destination: navio-config-bus
    stream:
      kafka:
        binder:
          brokers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://discovery-server:8761/eureka}
    register-with-eureka: true
    fetch-registry: true
    healthcheck:
      enabled: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  prometheus:
    metrics:
      export:
        enabled: true

server:
  port: 8083

navio:
  mobility:
    providers:
      # compose.production.yml enables this and points it at the transit-router service.
      otp:
        enabled: ${NAVIO_OTP_ENABLED:false}
        endpoint: ${NAVIO_OTP_ENDPOINT:http://transit-router:8080/otp/gtfs/v1}
        connect-timeout: ${NAVIO_OTP_CONNECT_TIMEOUT:2s}
        read-timeout: ${NAVIO_OTP_READ_TIMEOUT:8s}
        network-id: ${NAVIO_OTP_NETWORK_ID:local}
      google-maps:
        api-key: ${GOOGLE_MAPS_SERVER_API_KEY:}
        places:
          base-url: ${GOOGLE_PLACES_BASE_URL:https://places.googleapis.com/v1}
          connect-timeout: ${GOOGLE_PLACES_CONNECT_TIMEOUT:2s}
          read-timeout: ${GOOGLE_PLACES_READ_TIMEOUT:4s}
        routes:
          base-url: ${GOOGLE_ROUTES_BASE_URL:https://routes.googleapis.com/directions/v2:computeRoutes}
          connect-timeout: ${GOOGLE_ROUTES_CONNECT_TIMEOUT:2s}
          read-timeout: ${GOOGLE_ROUTES_READ_TIMEOUT:8s}
        cache:
          place-fresh-ttl: ${GOOGLE_PLACES_CACHE_FRESH_TTL:15m}
          place-stale-ttl: ${GOOGLE_PLACES_CACHE_STALE_TTL:24h}
          route-fresh-ttl: ${GOOGLE_ROUTES_CACHE_FRESH_TTL:5m}
          route-stale-ttl: ${GOOGLE_ROUTES_CACHE_STALE_TTL:30m}
          maximum-size: ${GOOGLE_PROVIDER_CACHE_MAXIMUM_SIZE:10000}
      mapbox:
        access-token: ${MAPBOX_ACCESS_TOKEN:}

resilience4j:
  circuitbreaker:
    instances:
      openTripPlanner:
        sliding-window-type: count-based
        sliding-window-size: 20
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
      googleTransit:
        sliding-window-type: count-based
        sliding-window-size: 20
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
  # Without an entry, Spring Cloud CircuitBreaker applies its default 1s TimeLimiter,
  # which aborts provider calls long before the HTTP client budgets expire. Keep each
  # value above the matching connect-timeout + read-timeout.
  timelimiter:
    instances:
      openTripPlanner:
        timeout-duration: ${NAVIO_OTP_CALL_TIMEOUT:11s}
      googleTransit:
        timeout-duration: ${GOOGLE_ROUTES_CALL_TIMEOUT:11s}
      googlePlaces:
        timeout-duration: ${GOOGLE_PLACES_CALL_TIMEOUT:7s}
      googleRoutes:
        timeout-duration: ${GOOGLE_ROUTES_CALL_TIMEOUT:11s}

