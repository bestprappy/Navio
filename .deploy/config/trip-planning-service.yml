spring:
  datasource:
    url: ${TRIP_DB_URL:jdbc:postgresql://postgres:5432/tripplanner}
    username: ${TRIP_DB_USERNAME:tripplanner}
    password: ${TRIP_DB_PASSWORD}
  jpa:
    database: POSTGRESQL
    open-in-view: false
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        default_schema: trip
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: trip
    default-schema: trip
    create-schemas: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    consumer:
      group-id: trip-planning-service
      auto-offset-reset: earliest
    producer:
      acks: all
      properties:
        # Fail a send in seconds when the broker is down; the outbox retries later.
        max.block.ms: 10000
        delivery.timeout.ms: 15000
        request.timeout.ms: 5000
  cloud:
    bus:
      destination: navio-config-bus
    stream:
      kafka:
        binder:
          brokers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
  cache:
    cache-names: currencyRates
    caffeine:
      spec: maximumSize=32,expireAfterWrite=12h,recordStats

navio:
  outbox:
    # trip.events.v1 transactional outbox: SharedPlanListed.v1 for follower notifications.
    topic: trip.events.v1
    retention: P14D
    relay:
      enabled: ${TRIP_OUTBOX_RELAY_ENABLED:true}
      interval-ms: 2000
  currency-provider:
    base-url: ${CURRENCY_PROVIDER_BASE_URL:https://api.frankfurter.dev}
  mobility:
    base-url: ${MOBILITY_SERVICE_BASE_URL:http://mobility-and-ev-service:8083}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://discovery-server:8761/eureka}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  prometheus:
    metrics:
      export:
        enabled: true

server:
  port: 8082

