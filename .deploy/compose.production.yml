name: navio

x-common-java-environment: &common-java-environment
  EUREKA_URL: http://discovery-server:8761/eureka
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "0.0"
  MANAGEMENT_TRACING_EXPORT_ZIPKIN_ENABLED: "false"
  TZ: Asia/Bangkok

x-java-service: &java-service
  restart: unless-stopped
  init: true
  networks:
    - backend
  security_opt:
    - no-new-privileges:true
  environment:
    <<: *common-java-environment

services:
  postgres:
    image: postgis/postgis:16-3.5-alpine
    restart: unless-stopped
    mem_limit: 700m
    shm_size: 128m
    networks:
      - backend
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tripplanner}
      POSTGRES_USER: ${POSTGRES_USER:-tripplanner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      TZ: Asia/Bangkok
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init-keycloak.sql:/docker-entrypoint-initdb.d/10-keycloak.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  kafka:
    image: confluentinc/cp-kafka:8.3.0
    restart: unless-stopped
    mem_limit: 850m
    networks:
      - backend
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-885sUBCQTzGwY-lF8YV-uQ}
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 45s

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.1
    command:
      - start
      - --http-enabled=true
      - --proxy-headers=xforwarded
    restart: unless-stopped
    mem_limit: 900m
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD is required}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-tripplanner}
      KC_DB_SCHEMA: keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:-tripplanner}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: http://navio.sit.kmutt.ac.th
      KC_HOSTNAME_STRICT: "true"
      KC_PROXY_TRUSTED_ADDRESSES: 127.0.0.0/8,172.16.0.0/12
      JAVA_OPTS_KC_HEAP: -Xms256m -Xmx640m
      TZ: Asia/Bangkok
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3",
        ]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 90s

  config-server:
    <<: *java-service
    image: ${NAVIO_IMAGE_PREFIX:?NAVIO_IMAGE_PREFIX is required}-configuration-server:${NAVIO_IMAGE_TAG:?NAVIO_IMAGE_TAG is required}
    mem_limit: 420m
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      <<: *common-java-environment
      SPRING_CLOUD_CONFIG_SERVER_NATIVE_SEARCH_LOCATIONS: file:/config
    volumes:
      - ./config:/config:ro
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8888/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 45s

  discovery-server:
    <<: *java-service
    image: ${NAVIO_IMAGE_PREFIX:?NAVIO_IMAGE_PREFIX is required}-discovery-server:${NAVIO_IMAGE_TAG:?NAVIO_IMAGE_TAG is required}
    mem_limit: 420m
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 45s

  user-management-service:
    <<: *java-service
    image: ${NAVIO_IMAGE_PREFIX:?NAVIO_IMAGE_PREFIX is required}-user-management-service:${NAVIO_IMAGE_TAG:?NAVIO_IMAGE_TAG is required}
    mem_limit: 400m
    environment:
      <<: *common-java-environment
      SERVER_PORT: "8081"
      SPRING_DATASOURCE_URL: jdbc:h2:file:/data/navio-users;DB_CLOSE_ON_EXIT=FALSE
      SPRING_DATASOURCE_USERNAME: navio
      SPRING_DATASOURCE_PASSWORD: ${USER_DB_PASSWORD:?USER_DB_PASSWORD is required}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    volumes:
      - user-data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 45s

  trip-planning-service:
    <<: *java-service
    image: ${NAVIO_IMAGE_PREFIX:?NAVIO_IMAGE_PREFIX is required}-trip-planning-service:${NAVIO_IMAGE_TAG:?NAVIO_IMAGE_TAG is required}
    mem_limit: 700m
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    environment:
      <<: *common-java-environment
      CONFIG_SERVER_URL: http://config-server:8888
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888
      TRIP_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-tripplanner}
      TRIP_DB_USERNAME: ${POSTGRES_USER:-tripplanner}
      TRIP_DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      MOBILITY_SERVICE_BASE_URL: http://mobility-and-ev-service:8083
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s

  mobility-and-ev-service:
    <<: *java-service
    image: ${NAVIO_IMAGE_PREFIX:?NAVIO_IMAGE_PREFIX is required}-mobility-and-ev-service:${NAVIO_IMAGE_TAG:?NAVIO_IMAGE_TAG is required}
    mem_limit: 650m
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    environment:
      <<: *common-java-environment
      CONFIG_SERVER_URL: http://config-server:8888
      MOBILITY_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-tripplanner}
      MOBILITY_DB_USERNAME: ${POSTGRES_USER:-tripplanner}
      MOBILITY_DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      GOOGLE_MAPS_SERVER_API_KEY: ${GOOGLE_MAPS_SERVER_API_KEY:-}
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8083/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s

  community-service:
    <<: *java-service
    image: ${NAVIO_IMAGE_PREFIX:?NAVIO_IMAGE_PREFIX is required}-community-service:${NAVIO_IMAGE_TAG:?NAVIO_IMAGE_TAG is required}
    mem_limit: 500m
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    environment:
      <<: *common-java-environment
      CONFIG_SERVER_URL: http://config-server:8888
      COMMUNITY_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-tripplanner}
      COMMUNITY_DB_USERNAME: ${POSTGRES_USER:-tripplanner}
      COMMUNITY_DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      COMMUNITY_MEDIA_STORAGE_PATH: /data/community-media
    volumes:
      - community-media:/data/community-media
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8084/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s

  api-gateway:
    <<: *java-service
    image: ${NAVIO_IMAGE_PREFIX:?NAVIO_IMAGE_PREFIX is required}-api-gateway:${NAVIO_IMAGE_TAG:?NAVIO_IMAGE_TAG is required}
    mem_limit: 500m
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      user-management-service:
        condition: service_healthy
      trip-planning-service:
        condition: service_healthy
      mobility-and-ev-service:
        condition: service_healthy
      community-service:
        condition: service_healthy
    environment:
      <<: *common-java-environment
      CONFIG_SERVER_URL: http://config-server:8888
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s

  nginx:
    image: nginx:1.29-alpine
    restart: unless-stopped
    mem_limit: 64m
    networks:
      - backend
    ports:
      - "80:80"
    depends_on:
      api-gateway:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    volumes:
      - ./nginx/navio.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

networks:
  backend:
    name: navio-backend
    driver: bridge

volumes:
  postgres-data:
  kafka-data:
  user-data:
  community-media:
