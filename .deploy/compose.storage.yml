name: navio-storage

# Private S3 storage for the VM deployment. No ports are published to the host.
services:
  community-storage:
    image: ghcr.io/bestprappy/navio-community-storage:${NAVIO_IMAGE_TAG:?Set the release image tag}
    restart: unless-stopped
    mem_limit: 384m
    security_opt:
      - no-new-privileges:true
    command: server /data --console-address :9001
    networks:
      - backend
    environment:
      MINIO_ROOT_USER: ${COMMUNITY_STORAGE_ROOT_USER:?Set the storage administrator}
      MINIO_ROOT_PASSWORD: ${COMMUNITY_STORAGE_ROOT_PASSWORD:?Set the storage administrator password}
    volumes:
      - community-object-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  community-storage-init:
    image: quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z
    mem_limit: 128m
    networks:
      - backend
    depends_on:
      community-storage:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${COMMUNITY_STORAGE_ROOT_USER:?Set the storage administrator}
      MINIO_ROOT_PASSWORD: ${COMMUNITY_STORAGE_ROOT_PASSWORD:?Set the storage administrator password}
      COMMUNITY_S3_BUCKET: ${COMMUNITY_S3_BUCKET:-navio-community}
      COMMUNITY_S3_ACCESS_KEY_ID: ${COMMUNITY_S3_ACCESS_KEY_ID:?Set the service access key}
      COMMUNITY_S3_SECRET_ACCESS_KEY: ${COMMUNITY_S3_SECRET_ACCESS_KEY:?Set the service secret key}
      MC_CONFIG_DIR: /tmp/mc
    entrypoint:
      - /bin/sh
      - -ec
      - |
        case "$$COMMUNITY_S3_BUCKET" in ''|*[!a-z0-9.-]*) echo 'Invalid bucket name' >&2; exit 1;; esac
        mc alias set admin http://community-storage:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null
        mc mb --ignore-existing "admin/$$COMMUNITY_S3_BUCKET" >/dev/null
        mc anonymous set none "admin/$$COMMUNITY_S3_BUCKET" >/dev/null
        mc admin user add admin "$$COMMUNITY_S3_ACCESS_KEY_ID" "$$COMMUNITY_S3_SECRET_ACCESS_KEY" >/dev/null
        cat > /tmp/picture-policy.json <<EOF
        {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:GetBucketLocation","s3:ListBucket"],"Resource":["arn:aws:s3:::$$COMMUNITY_S3_BUCKET"]},{"Effect":"Allow","Action":["s3:GetObject","s3:PutObject","s3:DeleteObject"],"Resource":["arn:aws:s3:::$$COMMUNITY_S3_BUCKET/*"]}]}
        EOF
        mc admin policy create admin community-pictures /tmp/picture-policy.json >/dev/null
        mc admin policy attach admin community-pictures --user "$$COMMUNITY_S3_ACCESS_KEY_ID" >/dev/null
        mc alias set service http://community-storage:9000 "$$COMMUNITY_S3_ACCESS_KEY_ID" "$$COMMUNITY_S3_SECRET_ACCESS_KEY" >/dev/null
        probe="service/$$COMMUNITY_S3_BUCKET/deployment-check/$$(cat /proc/sys/kernel/random/uuid).png"
        trap 'mc rm "$$probe" >/dev/null' EXIT
        printf '%s' 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=' | base64 -d > /tmp/picture.png
        mc cp /tmp/picture.png "$$probe" >/dev/null
        # The mc image carries no diffutils, so cmp(1) is unavailable. Compare
        # through base64 instead: both sides run the same encoder, so any line
        # wrapping is identical and this stays a byte-for-byte check.
        if [ "$$(mc cat "$$probe" | base64)" != "$$(base64 < /tmp/picture.png)" ]; then
          echo 'Stored picture did not read back byte-for-byte.' >&2
          exit 1
        fi
        mc rm "$$probe" >/dev/null
        trap - EXIT
        echo 'Community picture storage: private bucket and service write/read/delete verified.'

networks:
  backend:
    external: true
    name: navio-backend

volumes:
  community-object-data:
