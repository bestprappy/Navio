# Local S3-compatible storage. Start with: docker compose -f docker-compose.storage.yml up -d
#
# Docker Hub no longer serves minio/minio or minio/mc. This is the public image the
# release pipeline builds from source (.deploy/docker/community-storage.Dockerfile);
# it contains both the MinIO server and the mc client.
x-storage-image: &storage-image ghcr.io/bestprappy/navio-community-storage:056953bcc048cdfb3dbbc7840997fd6464ad938f

services:
  minio:
    image: *storage-image
    # Volumes created by the earlier upstream image are owned by root.
    user: "0:0"
    command: server /data --console-address :9001
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-navio-local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-navio-local-storage}
    volumes:
      - community-object-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
  minio-init:
    image: *storage-image
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-navio-local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-navio-local-storage}
      COMMUNITY_S3_BUCKET: ${COMMUNITY_S3_BUCKET:-navio-community}
      MC_CONFIG_DIR: /tmp/mc
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "local/$$COMMUNITY_S3_BUCKET"
        mc anonymous set none "local/$$COMMUNITY_S3_BUCKET"
volumes:
  community-object-data:
