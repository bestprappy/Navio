# Local S3-compatible storage. Start with: docker compose -f docker-compose.storage.yml up -d
services:
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-navio-local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-navio-local-storage}
    volumes:
      - community-object-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-navio-local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-navio-local-storage}
      COMMUNITY_S3_BUCKET: ${COMMUNITY_S3_BUCKET:-navio-community}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "local/$$COMMUNITY_S3_BUCKET"
        mc anonymous set none "local/$$COMMUNITY_S3_BUCKET"
volumes:
  community-object-data:
